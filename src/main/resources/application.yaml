server:
  port: 8989

spring:
  application:
    name: IdentityHub

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/identityhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: root
